before_script:
  - npm ci
builds:
  build_1:
    name: Syntax
    paths:
      - "**"
      - "!**"
      - "bin/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "peak_flow.yml"
    script:
      - npm run syntax
  build_2:
    name: ESLint
    paths:
      - "**"
      - "!**"
      - "bin/**"
      - "src/**"
      - "spec/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - "peak_flow.yml"
    script:
      - npm run lint
  build_3:
    name: Jasmine
    paths:
      - "**"
      - "!**"
      - "src/**"
      - "spec/**"
      - "package.json"
      - "package-lock.json"
      - "peak_flow.yml"
    script:
      - npm test
